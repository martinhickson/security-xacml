name: Release

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to create'
        required: false
        default: '2.1.8.jakarta.bravura.1'
        type: string
      version:
        description: 'Version to set (e.g., 2.1.8.jakarta.bravura.1)'
        required: false
        default: '2.1.8.jakarta.bravura.1'
        type: string
      tag_name:
        description: 'Tag name for release'
        required: false
        default: '2.1.8.jakarta.bravura.1'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create and checkout branch
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          git checkout -b "$BRANCH_NAME" || git checkout "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME" || echo "Branch already exists on remote"

      - name: Set Maven version
        run: |
          VERSION="${{ inputs.version }}"
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn versions:commit

      - name: Build with mvn17 (skip tests)
        run: |
          # Use mvn17 if available, otherwise use mvn with Java 17
          if command -v mvn17 &> /dev/null; then
            mvn17 clean package -DskipTests=true
          else
            mvn clean package -DskipTests=true
          fi

      - name: Commit version changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "Set version to ${{ inputs.version }}"
          git push origin "${{ inputs.branch_name }}" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          TAG_NAME="${{ inputs.tag_name }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          target_commitish: ${{ inputs.branch_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

